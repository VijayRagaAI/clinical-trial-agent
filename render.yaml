services:
  # Backend Service
  - type: web
    name: clinical-trial-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && python start_backend.py --host 0.0.0.0 --port $PORT --reload false"
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: CORS_ORIGINS
        value: "https://clinical-trial-agent-7h65-git-verc-87bf33-vjs-projects-df08cc2e.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PYTHONPATH
        value: "/opt/render/project/src/backend" 